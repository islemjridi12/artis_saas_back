apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: provisioning-sensor
  namespace: argo-events
spec:
  template:
    serviceAccountName: operate-workflow-sa

  dependencies:
    - name: create-dep
      eventSourceName: provisioning-amqp
      eventName: create
    - name: migrate-dep
      eventSourceName: provisioning-amqp
      eventName: migrate
    - name: expire-dep
      eventSourceName: provisioning-amqp
      eventName: expire

  triggers:

    # ═══════════════════════════════════════════════════════════════════════
    # Trigger 1 : PROVISION (nouveau tenant DEMO ou PROD)
    # ═══════════════════════════════════════════════════════════════════════
    - template:
        name: provision-trigger
        conditions: "create-dep"
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: provision-
                namespace: argo
              spec:
                entrypoint: pipeline
                serviceAccountName: argo
                onExit: cleanup-dev-schema
                arguments:
                  parameters:
                    - name: tenantDomain
                      value: "PLACEHOLDER"
                    - name: schemaName
                      value: "PLACEHOLDER"
                    - name: databaseName
                      value: "PLACEHOLDER"
                    - name: devSchema
                      value: "PLACEHOLDER"
                    - name: requestId
                      value: "PLACEHOLDER"
                volumes:
                  - name: atlas-migrations
                    hostPath:
                      path: /mnt/atlas-migrations
                      type: Directory

                templates:
                  - name: pipeline
                    steps:
                      - - name: create-schema
                          template: create-schema
                      - - name: create-dev-schema
                          template: create-dev-schema
                      - - name: atlas-schema
                          template: atlas-schema
                      - - name: notify
                          template: notify

                  - name: create-schema
                    container:
                      image: postgres:15-alpine
                      command: [psql]
                      env:
                        - name: PGPASSWORD
                          valueFrom:
                            secretKeyRef:
                              name: artis-secrets
                              key: postgres-password
                      args:
                        - "postgres://postgres:$(PGPASSWORD)@postgresql.artis.svc.cluster.local:5432/{{workflow.parameters.databaseName}}"
                        - "-c"
                        - "CREATE SCHEMA IF NOT EXISTS {{workflow.parameters.schemaName}};"

                  - name: create-dev-schema
                    container:
                      image: postgres:15-alpine
                      command: [psql]
                      env:
                        - name: PGPASSWORD
                          valueFrom:
                            secretKeyRef:
                              name: artis-secrets
                              key: postgres-password
                      args:
                        - "postgres://postgres:$(PGPASSWORD)@postgresql.artis.svc.cluster.local:5432/{{workflow.parameters.databaseName}}"
                        - "-c"
                        - "DROP SCHEMA IF EXISTS {{workflow.parameters.devSchema}} CASCADE; CREATE SCHEMA {{workflow.parameters.devSchema}};"

                  - name: atlas-schema
                    container:
                      image: arigaio/atlas:latest
                      command: ["/atlas"]
                      env:
                        - name: PGPASSWORD
                          valueFrom:
                            secretKeyRef:
                              name: artis-secrets
                              key: postgres-password
                      args:
                        - schema
                        - apply
                        - --url
                        - "postgres://postgres:$(PGPASSWORD)@postgresql.artis.svc.cluster.local:5432/{{workflow.parameters.databaseName}}?search_path={{workflow.parameters.schemaName}}&sslmode=disable"
                        - --dev-url
                        - "postgres://postgres:$(PGPASSWORD)@postgresql.artis.svc.cluster.local:5432/{{workflow.parameters.databaseName}}?search_path={{workflow.parameters.devSchema}}&sslmode=disable"
                        - --to
                        - "file:///migrations/schema.sql"
                        - --auto-approve
                      volumeMounts:
                        - name: atlas-migrations
                          mountPath: /migrations
                          readOnly: true

                  - name: cleanup-dev-schema
                    container:
                      image: postgres:15-alpine
                      command: [psql]
                      env:
                        - name: PGPASSWORD
                          valueFrom:
                            secretKeyRef:
                              name: artis-secrets
                              key: postgres-password
                      args:
                        - "postgres://postgres:$(PGPASSWORD)@postgresql.artis.svc.cluster.local:5432/{{workflow.parameters.databaseName}}"
                        - "-c"
                        - "DROP SCHEMA IF EXISTS {{workflow.parameters.devSchema}} CASCADE;"

                  - name: notify
                    container:
                      image: curlimages/curl:latest
                      command: [sh, -c]
                      env:
                        - name: INTERNAL_SECRET
                          valueFrom:
                            secretKeyRef:
                              name: internal-api-secret
                              key: secret
                      args:
                        - |
                          curl -s -X POST http://saas-platform.artis.svc.cluster.local:8081/api/internal/provisioning/complete \
                            -H "Content-Type: application/json" \
                            -H "X-Internal-Secret: $INTERNAL_SECRET" \
                            -d "{\"requestId\":\"{{workflow.parameters.requestId}}\",\"domain\":\"{{workflow.parameters.tenantDomain}}\",\"status\":\"SUCCESS\"}"

          parameters:
            - src:
                dependencyName: create-dep
                dataKey: body.tenantDomain
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: create-dep
                dataKey: body.schemaName
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: create-dep
                dataKey: body.databaseName
              dest: spec.arguments.parameters.2.value
            - src:
                dependencyName: create-dep
                dataKey: body.devSchema
              dest: spec.arguments.parameters.3.value
            - src:
                dependencyName: create-dep
                dataKey: body.requestId
              dest: spec.arguments.parameters.4.value
            - src:
                dependencyName: create-dep
                dataKey: body.tenantDomain
              dest: metadata.generateName
              operation: append

    # ═══════════════════════════════════════════════════════════════════════
    # Trigger 2 : MIGRATE (DEMO -> PROD avec/sans donnees)
    # ═══════════════════════════════════════════════════════════════════════
    - template:
        name: migrate-trigger
        conditions: "migrate-dep"
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: migrate-
                namespace: argo
              spec:
                entrypoint: pipeline
                serviceAccountName: argo
                onExit: cleanup-dev-schema
                arguments:
                  parameters:
                    - name: tenantDomain
                      value: "PLACEHOLDER"
                    - name: prodSchemaName
                      value: "PLACEHOLDER"
                    - name: demoSchemaName
                      value: "PLACEHOLDER"
                    - name: databaseName
                      value: "PLACEHOLDER"
                    - name: demoDatabaseName
                      value: "PLACEHOLDER"
                    - name: devSchema
                      value: "PLACEHOLDER"
                    - name: requestId
                      value: "PLACEHOLDER"
                    - name: withData
                      value: "false"
                volumes:
                  - name: atlas-migrations
                    hostPath:
                      path: /mnt/atlas-migrations
                      type: Directory
                  - name: migrate-sql
                    configMap:
                      name: migrate-tables-sql
                      defaultMode: 0755

                templates:
                  - name: pipeline
                    steps:
                      - - name: create-prod-schema
                          template: create-prod-schema
                      - - name: create-dev-schema
                          template: create-dev-schema
                      - - name: atlas-schema
                          template: atlas-schema
                      - - name: copy-data
                          template: copy-data
                          when: "{{workflow.parameters.withData}} == true"
                      - - name: drop-demo-schema
                          template: drop-demo-schema
                      - - name: notify
                          template: notify

                  - name: create-prod-schema
                    container:
                      image: postgres:15-alpine
                      command: [psql]
                      env:
                        - name: PGPASSWORD
                          valueFrom:
                            secretKeyRef:
                              name: artis-secrets
                              key: postgres-password
                      args:
                        - "postgres://postgres:$(PGPASSWORD)@postgresql.artis.svc.cluster.local:5432/{{workflow.parameters.databaseName}}"
                        - "-c"
                        - "CREATE SCHEMA IF NOT EXISTS {{workflow.parameters.prodSchemaName}};"

                  - name: create-dev-schema
                    container:
                      image: postgres:15-alpine
                      command: [psql]
                      env:
                        - name: PGPASSWORD
                          valueFrom:
                            secretKeyRef:
                              name: artis-secrets
                              key: postgres-password
                      args:
                        - "postgres://postgres:$(PGPASSWORD)@postgresql.artis.svc.cluster.local:5432/{{workflow.parameters.databaseName}}"
                        - "-c"
                        - "DROP SCHEMA IF EXISTS {{workflow.parameters.devSchema}} CASCADE; CREATE SCHEMA {{workflow.parameters.devSchema}};"

                  - name: atlas-schema
                    container:
                      image: arigaio/atlas:latest
                      command: ["/atlas"]
                      env:
                        - name: PGPASSWORD
                          valueFrom:
                            secretKeyRef:
                              name: artis-secrets
                              key: postgres-password
                      args:
                        - schema
                        - apply
                        - --url
                        - "postgres://postgres:$(PGPASSWORD)@postgresql.artis.svc.cluster.local:5432/{{workflow.parameters.databaseName}}?search_path={{workflow.parameters.prodSchemaName}}&sslmode=disable"
                        - --dev-url
                        - "postgres://postgres:$(PGPASSWORD)@postgresql.artis.svc.cluster.local:5432/{{workflow.parameters.databaseName}}?search_path={{workflow.parameters.devSchema}}&sslmode=disable"
                        - --to
                        - "file:///migrations/schema.sql"
                        - --auto-approve
                      volumeMounts:
                        - name: atlas-migrations
                          mountPath: /migrations
                          readOnly: true

                  # ─── Step 4 : Copy data via ConfigMap script ───
                  - name: copy-data
                    container:
                      image: postgres:15-alpine
                      command: [sh, /sql/copy-tables.sh]
                      args:
                        - "{{workflow.parameters.demoDatabaseName}}"
                        - "{{workflow.parameters.databaseName}}"
                        - "{{workflow.parameters.demoSchemaName}}"
                        - "{{workflow.parameters.prodSchemaName}}"
                      env:
                        - name: PGPASSWORD
                          valueFrom:
                            secretKeyRef:
                              name: artis-secrets
                              key: postgres-password
                      volumeMounts:
                        - name: migrate-sql
                          mountPath: /sql

                  - name: drop-demo-schema
                    container:
                      image: postgres:15-alpine
                      command: [psql]
                      env:
                        - name: PGPASSWORD
                          valueFrom:
                            secretKeyRef:
                              name: artis-secrets
                              key: postgres-password
                      args:
                        - "postgres://postgres:$(PGPASSWORD)@postgresql.artis.svc.cluster.local:5432/{{workflow.parameters.demoDatabaseName}}"
                        - "-c"
                        - "DROP SCHEMA IF EXISTS {{workflow.parameters.demoSchemaName}} CASCADE;"

                  - name: cleanup-dev-schema
                    container:
                      image: postgres:15-alpine
                      command: [psql]
                      env:
                        - name: PGPASSWORD
                          valueFrom:
                            secretKeyRef:
                              name: artis-secrets
                              key: postgres-password
                      args:
                        - "postgres://postgres:$(PGPASSWORD)@postgresql.artis.svc.cluster.local:5432/{{workflow.parameters.databaseName}}"
                        - "-c"
                        - "DROP SCHEMA IF EXISTS {{workflow.parameters.devSchema}} CASCADE;"

                  - name: notify
                    container:
                      image: curlimages/curl:latest
                      command: [sh, -c]
                      env:
                        - name: INTERNAL_SECRET
                          valueFrom:
                            secretKeyRef:
                              name: internal-api-secret
                              key: secret
                      args:
                        - |
                          curl -s -X POST http://saas-platform.artis.svc.cluster.local:8081/api/internal/provisioning/complete \
                            -H "Content-Type: application/json" \
                            -H "X-Internal-Secret: $INTERNAL_SECRET" \
                            -d "{\"requestId\":\"{{workflow.parameters.requestId}}\",\"domain\":\"{{workflow.parameters.tenantDomain}}\",\"status\":\"MIGRATED\"}"

          parameters:
            - src:
                dependencyName: migrate-dep
                dataKey: body.tenantDomain
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: migrate-dep
                dataKey: body.prodSchemaName
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: migrate-dep
                dataKey: body.demoSchemaName
              dest: spec.arguments.parameters.2.value
            - src:
                dependencyName: migrate-dep
                dataKey: body.databaseName
              dest: spec.arguments.parameters.3.value
            - src:
                dependencyName: migrate-dep
                dataKey: body.demoDatabaseName
              dest: spec.arguments.parameters.4.value
            - src:
                dependencyName: migrate-dep
                dataKey: body.devSchema
              dest: spec.arguments.parameters.5.value
            - src:
                dependencyName: migrate-dep
                dataKey: body.requestId
              dest: spec.arguments.parameters.6.value
            - src:
                dependencyName: migrate-dep
                dataKey: body.withData
              dest: spec.arguments.parameters.7.value
            - src:
                dependencyName: migrate-dep
                dataKey: body.tenantDomain
              dest: metadata.generateName
              operation: append

    # ═══════════════════════════════════════════════════════════════════════
    # Trigger 3 : EXPIRE (30 jours apres suspension)
    # ═══════════════════════════════════════════════════════════════════════
    - template:
        name: expire-trigger
        conditions: "expire-dep"
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: expire-
                namespace: argo
              spec:
                entrypoint: pipeline
                serviceAccountName: argo
                arguments:
                  parameters:
                    - name: tenantDomain
                      value: "PLACEHOLDER"
                    - name: schemaName
                      value: "PLACEHOLDER"
                    - name: databaseName
                      value: "PLACEHOLDER"
                templates:
                  - name: pipeline
                    steps:
                      - - name: drop-schema
                          template: drop-schema
                  - name: drop-schema
                    container:
                      image: postgres:15-alpine
                      command: [psql]
                      env:
                        - name: PGPASSWORD
                          valueFrom:
                            secretKeyRef:
                              name: artis-secrets
                              key: postgres-password
                      args:
                        - "postgres://postgres:$(PGPASSWORD)@postgresql.artis.svc.cluster.local:5432/{{workflow.parameters.databaseName}}"
                        - "-c"
                        - "DROP SCHEMA IF EXISTS {{workflow.parameters.schemaName}} CASCADE;"
          parameters:
            - src:
                dependencyName: expire-dep
                dataKey: body.tenantDomain
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: expire-dep
                dataKey: body.schemaName
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: expire-dep
                dataKey: body.databaseName
              dest: spec.arguments.parameters.2.value
            - src:
                dependencyName: expire-dep
                dataKey: body.tenantDomain
              dest: metadata.generateName
              operation: append