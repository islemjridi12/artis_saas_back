apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-platform
  namespace: artis
  labels:
    app: saas-platform
    component: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: saas-platform
  template:
    metadata:
      labels:
        app: saas-platform
        component: backend
    spec:
      containers:
        - name: saas-platform
          image: artis/saas-platform:v39
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: saas-platform-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: APP_PUBLIC_URL
              value: "https://lyndsey-sawlike-bret.ngrok-free.dev"
            - name: APP_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: internal-api-secret
                  key: secret
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: artis-secrets
                  key: mail-password
            - name: PAYMEE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: artis-secrets
                  key: paymee-api-token
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: artis-secrets
                  key: keycloak-admin-password
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: artis-secrets
                  key: postgres-password
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: artis-secrets
                  key: rabbitmq-password

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1.5Gi"
              cpu: "1000m"