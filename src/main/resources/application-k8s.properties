# DATABASE
spring.datasource.url=jdbc:postgresql://postgresql:5432/saasPlatform
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ARTIS DB
artis.datasource.url=jdbc:postgresql://postgresql:5432/artisdb
artis.datasource.username=postgres
artis.datasource.password=${DB_PASSWORD}
artis.datasource.driver-class-name=org.postgresql.Driver

# DEMO DB
demo.datasource.url=jdbc:postgresql://postgresql:5432/artisdb_demo
demo.datasource.username=postgres
demo.datasource.password=${DB_PASSWORD}
demo.datasource.driver-class-name=org.postgresql.Driver

# APP DATASOURCE DEMO
app.datasource.demo.url=jdbc:postgresql://postgresql:5432/artisdb_demo
app.datasource.demo.username=postgres
app.datasource.demo.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.liquibase.enabled=false

# KEYCLOAK
app.keycloak.url=http://keycloak:8080
keycloak.server-url=http://keycloak:8080
keycloak.admin-realm=master
keycloak.client-id=admin-cli
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
keycloak.admin.username=admin
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD}

# RABBITMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# URLS
app.frontend.url=http://artis.com
app.platform.url=http://localhost:8081

# CORS
app.cors.allowed-origins=http://angular-platform:80,http://angular-metier:80,http://localhost:4200,http://localhost:4201

# PAYMEE
paymee.base-url=https://sandbox.paymee.tn/api/v2
paymee.api-token=${PAYMEE_API_TOKEN}
paymee.public-base-url=${APP_PUBLIC_URL}
paymee.return-url=${paymee.public-base-url}/api/payment/redirect-success
paymee.cancel-url=${paymee.public-base-url}/api/payment/redirect-cancel
paymee.webhook-url=${paymee.public-base-url}/api/payment/webhook

# MAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=islemjridi19@gmail.com
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# INTERNAL SECRET
app.internal.secret=${APP_INTERNAL_SECRET:}

# ACTUATOR / PROMETHEUS
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=saas-platform
management.metrics.tags.namespace=artis